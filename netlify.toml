# Netlify build configuration for FlowCraft (static Vite SPA).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Access gate (personal access codes) in front of everything, including the
# AI endpoint. Declared here so it runs before the inline-configured
# /api/generate function.
[[edge_functions]]
  path = "/*"
  function = "access"
